name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/backend/*.gradle.kts
            apps/backend/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Backend integration tests and executable JAR
        working-directory: apps/backend
        run: ./gradlew --no-daemon test bootJar
      - name: Install web dependencies from lockfile
        working-directory: apps/web
        run: npm ci
      - name: Fast data and proxy contracts without application servers
        working-directory: apps/web
        run: npm run test:contracts
      - name: Production build and type check
        working-directory: apps/web
        run: npm run build && npm run typecheck
      - name: Install test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests against real frontend and backend
        working-directory: apps/web
        run: npm run test:e2e
      - name: Local development origin and interaction regression checks
        working-directory: apps/web
        run: npm run test:dev
